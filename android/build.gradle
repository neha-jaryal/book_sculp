// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // Shared versions – you can override in app/build.gradle if needed
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 35
        targetSdkVersion = 35

        // Optional: Set a project-wide NDK version fallback
        // ndkVersion = "28.0.12674087"   // Recommended newer version
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Android Gradle Plugin – 8.5.0 is solid for RN in 2026
        classpath("com.android.tools.build:gradle:8.5.0")

        // Kotlin plugin - 1.9.24 works well with JVM 17 toolchain
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")

        // React Native plugin is applied in app/build.gradle
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        // Required for React Native local AARs and prefabs
        maven {
            url("$rootDir/../node_modules/react-native/android")
        }

        // For some community libs
        maven { url 'https://www.jitpack.io' }
    }
}

// Force consistent JVM 17 targets across ALL subprojects (app + all react-native-* libraries)
subprojects {
    afterEvaluate { project ->
        // Only apply to Android modules and Kotlin-enabled ones
        if (project.plugins.hasPlugin('com.android.application') ||
            project.plugins.hasPlugin('com.android.library') ||
            project.plugins.hasPlugin('kotlin-android')) {

            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                // If the subproject has kotlinOptions block, force it
                if (project.hasProperty('kotlinOptions')) {
                    kotlinOptions {
                        jvmTarget = "17"
                    }
                }
            }

            // Force all Kotlin compile tasks to JVM 17
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }

            // Modern best practice: Use JVM toolchain (auto-downloads JDK 17 if needed)
            // This usually overrides stubborn library defaults
            if (project.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
                kotlin {
                    jvmToolchain(17)
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}