// Top-level build file (android/build.gradle)

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 35
        targetSdkVersion = 35
        // ndkVersion can stay in app/build.gradle
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.0")  // or 8.6+ if your Android Studio supports
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
        // No need for classpath("com.facebook.react:react-native-gradle-plugin") — handled by includeBuild
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "$rootDir/../node_modules/react-native/android" }  // RN AARs/prefabs
        maven { url 'https://www.jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}